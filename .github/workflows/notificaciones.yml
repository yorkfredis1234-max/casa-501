name: Notificaciones 501

# Horarios en UTC. Bogotá = UTC-5, así que:
#   "50 0 * * 2"     = lunes 7:50 p.m.          → aseo (a cada uno lo suyo)
#   "50 16 * * 2"    = martes 11:50 a.m.        → recordatorio a quien no ha visto
#   "50 23 * * 2,5"  = martes y viernes 6:50 p.m. → basura
#   "*/5 * * * *"    = cada 5 minutos            → avisos nuevos
#   "50 11 * * *"    = todos los días 6:50 a.m.  → lavadora: a quien le toca lavar hoy
#   "50 21 * * *"    = todos los días 4:50 p.m.  → lavadora: a quien le toca recoger la ropa hoy
# Se programan 10 minutos antes porque GitHub a veces arranca con unos minutos de retraso.
on:
  schedule:
    - cron: '50 0 * * 2'
    - cron: '50 16 * * 2'
    - cron: '50 23 * * 2,5'
    - cron: '*/5 * * * *'
    - cron: '50 11 * * *'
    - cron: '50 21 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué enviar ahora'
        required: true
        default: 'prueba'
        type: choice
        options: [prueba, aseo, recordatorio, basura, avisos, lavar, recoger]

concurrency:
  group: notificaciones-${{ github.event.schedule || github.event.inputs.modo }}
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Enviar
        run: node scripts/notificar.mjs "${{ github.event.inputs.modo }}" "${{ github.event.schedule }}"
        env:
          CASA_CODIGO: ${{ secrets.CASA_CODIGO }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

